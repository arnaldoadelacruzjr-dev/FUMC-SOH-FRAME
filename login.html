<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FUMC SOH Frame Creator - Admin Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:
linear-gradient(
135deg,
#4b0082,
#6a0dad,
#8a2be2
);

padding:20px;

}

.container{

width:100%;
max-width:420px;

background:
rgba(255,255,255,.12);

backdrop-filter:blur(12px);

border-radius:25px;

padding:35px;

text-align:center;

color:white;

box-shadow:
0 10px 30px rgba(0,0,0,.25);

}

.logo{

width:100px;
height:100px;

margin:auto;

border-radius:50%;

background:
linear-gradient(
135deg,
#FFD700,
#FFA500
);

display:flex;
justify-content:center;
align-items:center;

font-size:42px;

box-shadow:
0 0 20px rgba(255,215,0,.5);

}

h1{

margin-top:20px;

color:#FFD700;

}

.subtitle{

margin-top:10px;
margin-bottom:25px;

opacity:.9;

}

input{

width:100%;

padding:14px;

margin-bottom:15px;

border:none;

border-radius:12px;

outline:none;

font-size:15px;

}

button{

width:100%;

padding:14px;

border:none;

border-radius:12px;

background:
linear-gradient(
135deg,
#FFD700,
#FFA500
);

color:#4b0082;

font-size:16px;

font-weight:bold;

cursor:pointer;

}

button:hover{

opacity:.95;

}

#status{

margin-top:15px;

color:#ffd4d4;

}

.admin-badge{

margin-top:20px;

padding:10px;

border-radius:10px;

background:
rgba(255,215,0,.15);

border:
1px solid rgba(255,215,0,.4);

color:#FFD700;

font-size:13px;

}

.credits{

margin-top:25px;

font-size:13px;

opacity:.85;

}

.credits strong{

color:#FFD700;

}

</style>

</head>

<body>

<div class="container">

<div class="logo">
✝
</div>

<h1>FUMC SOH Frame Creator</h1>

<p class="subtitle">
Administrator Access
</p>

<input
type="email"
id="email"
placeholder="Email Address">

<input
type="password"
id="password"
placeholder="Password">

<button id="loginBtn">
Login
</button>

<p id="status"></p>

<div class="admin-badge">
🔒 Authorized Administrators Only
</div>

<div class="credits">

Developed by

<strong>
Arnaldo Jr.
</strong>

</div>

</div>

<script
type="module"
src="js/auth.js">
</script>

</body>
</html>
