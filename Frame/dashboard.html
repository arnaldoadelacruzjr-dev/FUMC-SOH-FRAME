<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FUMC SOH Frame Creator - Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:
linear-gradient(
135deg,
#4b0082,
#6a0dad,
#8a2be2
);

min-height:100vh;

padding:20px;

color:white;

}

.container{

max-width:1200px;

margin:auto;

}

.header{

display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:25px;

}

.logo-section h1{

color:#FFD700;

font-size:32px;

}

.logo-section p{

opacity:.9;

margin-top:5px;

}

.actions{

display:flex;
gap:10px;

}

.btn{

border:none;

padding:12px 20px;

border-radius:12px;

cursor:pointer;

font-weight:bold;

}

.btn-primary{

background:
linear-gradient(
135deg,
#FFD700,
#FFA500
);

color:#4b0082;

}

.btn-danger{

background:#dc3545;
color:white;

}

.frames-grid{

display:grid;

grid-template-columns:
repeat(
auto-fill,
minmax(320px,1fr)
);

gap:20px;

}

.frame-card{

background:
rgba(255,255,255,.12);

backdrop-filter:blur(12px);

border-radius:20px;

overflow:hidden;

box-shadow:
0 8px 25px rgba(0,0,0,.25);

}

.frame-image{

width:100%;

height:auto;

max-height:500px;

object-fit:contain;

background:white;

display:block;

}

.frame-content{

padding:20px;

}

.frame-title{

font-size:20px;

font-weight:bold;

margin-bottom:15px;

color:#FFD700;

}

.frame-buttons{

display:grid;

grid-template-columns:
1fr 1fr;

gap:10px;

}

.frame-buttons button{

border:none;

padding:12px;

border-radius:10px;

cursor:pointer;

font-weight:bold;

}

.view-btn{

background:#198754;
color:white;

}

.copy-btn{

background:#0d6efd;
color:white;

}

.edit-btn{

background:#ffc107;
color:black;

}

.delete-btn{

background:#dc3545;
color:white;

}

.empty{

text-align:center;

padding:60px;

background:
rgba(255,255,255,.12);

border-radius:20px;

}

.credits{

text-align:center;

margin-top:40px;

opacity:.8;

}

.credits strong{

color:#FFD700;

}

@media(max-width:768px){

.header{

flex-direction:column;

align-items:flex-start;

gap:20px;

}

.actions{

width:100%;

display:grid;

grid-template-columns:1fr 1fr;

gap:10px;

}

.btn{

width:100%;

}

.logo-section h1{

font-size:26px;

}

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<div class="logo-section">

<h1>
🎨 FUMC SOH Frame Creator
</h1>

<p>
Manage and Share Your Frames
</p>

</div>

<div class="actions">

<button
class="btn btn-primary"
onclick="
window.location.href='newframe.html'
">

+ New Frame

</button>

<button
id="logoutBtn"
class="btn btn-danger">

Logout

</button>

</div>

</div>

<div id="frames">

<div class="empty">

Loading Frames...

</div>

</div>

<div class="credits">

FUMC SOH Frame Creator v1.0

<br><br>

Developed by

<strong>
Arnaldo Jr.
</strong>

</div>

</div>

<script
type="module"
src="js/dashboard.js">
</script>

</body>
</html>
