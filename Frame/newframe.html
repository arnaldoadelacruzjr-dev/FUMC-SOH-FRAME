<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>New Frame</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:
linear-gradient(
135deg,
#4b0082,
#6a0dad,
#8a2be2
);

min-height:100vh;

padding:20px;

color:white;

}

.container{

max-width:800px;

margin:auto;

}

.card{

background:
rgba(255,255,255,.12);

backdrop-filter:blur(12px);

border-radius:20px;

padding:30px;

box-shadow:
0 8px 25px rgba(0,0,0,.25);

}

.header{

display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:25px;

}

h1{

color:#FFD700;

}

.back-btn{

background:#6c757d;

color:white;

border:none;

padding:12px 18px;

border-radius:10px;

cursor:pointer;

}

input{

width:100%;

padding:14px;

margin-top:10px;
margin-bottom:20px;

border:none;

border-radius:12px;

outline:none;

}

.preview{

width:100%;

max-height:450px;

object-fit:contain;

background:white;

border-radius:15px;

padding:10px;

display:none;

}

.upload-box{

border:2px dashed #FFD700;

padding:20px;

border-radius:15px;

text-align:center;

margin-bottom:20px;

}

.save-btn{

width:100%;

padding:15px;

border:none;

border-radius:12px;

background:
linear-gradient(
135deg,
#FFD700,
#FFA500
);

color:#4b0082;

font-weight:bold;

font-size:16px;

cursor:pointer;

}

.status{

margin-top:15px;

text-align:center;

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="header">

<h1>
🖼 New Frame
</h1>

<button
class="back-btn"
onclick="
window.location.href=
'dashboard.html'
">

Back

</button>

</div>

<label>
Frame Title
</label>

<input
type="text"
id="title"
placeholder="Example: 8th Anniversary">

<div class="upload-box">

<p>
Upload Frame PNG
</p>

<br>

<input
type="file"
id="frameFile"
accept="image/png,image/*">

</div>

<img
id="preview"
class="preview">

<button
id="saveBtn"
class="save-btn">

Save Frame

</button>

<p
id="status"
class="status">
</p>

</div>

</div>

<script
type="module"
src="js/newframe.js">
</script>

</body>
</html>
