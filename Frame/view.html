<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>View Frame</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:
linear-gradient(
135deg,
#4b0082,
#6a0dad,
#8a2be2
);

min-height:100vh;

padding:20px;

color:white;

}

.container{

max-width:900px;

margin:auto;

}

.card{

background:
rgba(255,255,255,.12);

backdrop-filter:blur(12px);

border-radius:20px;

padding:30px;

box-shadow:
0 8px 25px rgba(0,0,0,.25);

}

.header{

display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:20px;

}

h1{

color:#FFD700;

}

.back-btn{

background:#6c757d;

color:white;

border:none;

padding:12px 18px;

border-radius:10px;

cursor:pointer;

}

.preview{

width:100%;

max-height:500px;

object-fit:contain;

background:white;

border-radius:15px;

padding:10px;

margin-bottom:20px;

}

.info{

margin-bottom:20px;

}

.info h2{

color:#FFD700;

margin-bottom:10px;

}

.link-box{

width:100%;

padding:12px;

border:none;

border-radius:10px;

margin-top:10px;

}

.buttons{

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:10px;

margin-top:20px;

}

button{

padding:14px;

border:none;

border-radius:10px;

font-weight:bold;

cursor:pointer;

}

.copy-btn{

background:#0d6efd;
color:white;

}

.edit-btn{

background:#ffc107;
color:black;

}

.delete-btn{

background:#dc3545;
color:white;

}

.open-btn{

background:#198754;
color:white;

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="header">

<h1>
🖼 Frame Details
</h1>

<button
class="back-btn"
onclick="
window.location.href=
'dashboard.html'
">

Back

</button>

</div>

<img
id="preview"
class="preview">

<div class="info">

<h2 id="frameTitle">
Loading...
</h2>

<label>
Public Link
</label>

<input
type="text"
id="frameLink"
class="link-box"
readonly>

</div>

<div class="buttons">

<button
class="copy-btn"
id="copyBtn">

Copy Link

</button>

<button
class="open-btn"
id="openBtn">

Open Frame

</button>

<button
class="edit-btn"
id="editBtn">

Edit Frame

</button>

<button
class="delete-btn"
id="deleteBtn">

Delete Frame

</button>

</div>

</div>

</div>

<script
type="module"
src="js/view.js">
</script>

</body>
</html>
